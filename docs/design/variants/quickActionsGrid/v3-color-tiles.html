<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>QuickActionsGrid — V3 Per-action color</title>
<style>
  :root {
    --bg: #0E0E0F; --surface: #17171A;
    --primary: #D4B07A;
    --text: #F4F1EA; --text-secondary: #C9C7C0; --text-tertiary: #8A8780;
    --border: rgba(255, 255, 255, 0.10);
    --calories: #E07A6B;    /* terracotta */
    --carbs: #9AC28C;       /* sage */
    --fats: #E8A36A;        /* amber */
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif; padding: 40px; width: 375px; }
  .label { color: var(--text-tertiary); font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 12px; }

  /* V3 — per-action icon-tile colour mapped to the domain (food=calories,
     weight=primary, progress=carbs/sage, AI=fats/amber). Reuses the
     existing Direction A macro palette — no new tokens. */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 18px; padding: 14px;
    cursor: pointer;
  }
  .icon-tile {
    width: 32px; height: 32px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 10px;
    font-size: 16px;
  }
  .icon-tile.cal { background: rgba(224, 122, 107, 0.14); color: var(--calories); }
  .icon-tile.gld { background: rgba(212, 176, 122, 0.14); color: var(--primary); }
  .icon-tile.sgr { background: rgba(154, 194, 140, 0.14); color: var(--carbs); }
  .icon-tile.amb { background: rgba(232, 163, 106, 0.14); color: var(--fats); }
  .label-text { color: var(--text); font-size: 13px; font-weight: 600; }
  .sub { color: var(--text-secondary); font-size: 11px; margin-top: 2px; }
</style>
</head>
<body>
  <div class="label">V3 — Per-action color (calories/weight/progress/AI mapped to macro palette)</div>
  <div class="grid">
    <div class="card">
      <div class="icon-tile cal">⌬</div>
      <div class="label-text">Сканировать еду</div>
      <div class="sub">ИИ определит КБЖУ</div>
    </div>
    <div class="card">
      <div class="icon-tile gld">⚖</div>
      <div class="label-text">Добавить вес</div>
      <div class="sub">Утреннее взвешивание</div>
    </div>
    <div class="card">
      <div class="icon-tile sgr">⚡</div>
      <div class="label-text">Прогресс</div>
      <div class="sub">Графики и статистика</div>
    </div>
    <div class="card">
      <div class="icon-tile amb">💬</div>
      <div class="label-text">Спросить AI</div>
      <div class="sub">Любой вопрос</div>
    </div>
  </div>
</body>
</html>
