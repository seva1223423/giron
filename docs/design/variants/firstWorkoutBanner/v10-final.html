<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>FirstWorkoutBanner — V10 FINAL</title>
<style>
  :root {
    --bg: #0E0E0F; --surface: #17171A;
    --primary: #D4B07A; --primary-deep: #B08A4E;
    --text: #F4F1EA; --text-secondary: #C9C7C0; --text-tertiary: #8A8780;
    --text-inverse: #0A0A0A;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif; padding: 40px; width: 375px; }
  .label { color: var(--text-tertiary); font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 12px; }

  /* V10 — final pick. Synthesises:
     - V7's ring (onboarding journey context — "1/4")
     - V6's premium gradient + corner orb
     - V9's secondary action, made concrete ("Через час" instead of vague "Позже")
     - Removed bullets (V8) — too noisy for a recurring banner */
  .banner {
    position: relative; border-radius: 16px;
    padding: 16px 16px 14px; overflow: hidden;
    background: linear-gradient(135deg, rgba(212, 176, 122, 0.14) 0%, rgba(212, 176, 122, 0.02) 100%), var(--surface);
    border: 1px solid rgba(212, 176, 122, 0.3);
  }
  .banner::before {
    content: ''; position: absolute; top: -30px; right: -30px;
    width: 110px; height: 110px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(212, 176, 122, 0.28) 0%, transparent 70%);
    pointer-events: none;
  }
  .close {
    position: absolute; top: 8px; right: 10px; padding: 4px;
    color: var(--text-secondary); background: transparent; border: none;
    cursor: pointer; font-size: 16px; line-height: 1; transform: rotate(45deg); z-index: 2;
  }
  .top { display: flex; align-items: center; gap: 13px; margin-bottom: 12px; }
  .ring { flex-shrink: 0; width: 46px; height: 46px; position: relative; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring-track { fill: none; stroke: rgba(212, 176, 122, 0.18); stroke-width: 4; }
  .ring-progress { fill: none; stroke: var(--primary); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 125.66; stroke-dashoffset: 94.25; }
  .ring-label { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: var(--primary); }
  .titles { flex: 1; min-width: 0; }
  .label-tag { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.4px; color: var(--primary); margin-bottom: 2px; }
  .title { font-size: 15px; font-weight: 700; color: var(--text); margin: 0; line-height: 20px; }
  .actions { display: flex; gap: 8px; }
  .cta-primary { flex: 1; padding: 11px 16px; border-radius: 10px; background: var(--primary); border: 1px solid var(--primary); color: var(--text-inverse); font-size: 13px; font-weight: 700; cursor: pointer; }
  .cta-secondary { padding: 11px 12px; border-radius: 10px; background: transparent; border: 1px solid rgba(255, 255, 255, 0.14); color: var(--text-secondary); font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
</style>
</head>
<body>
  <div class="label">V10 — FINAL pick (ring journey + hero fill + concrete snooze)</div>
  <div class="banner">
    <button class="close">+</button>
    <div class="top">
      <div class="ring">
        <svg viewBox="0 0 46 46">
          <circle class="ring-track" cx="23" cy="23" r="20" />
          <circle class="ring-progress" cx="23" cy="23" r="20" />
        </svg>
        <div class="ring-label">1/4</div>
      </div>
      <div class="titles">
        <div class="label-tag">НАСТРОЙКА</div>
        <h3 class="title">Первая тренировка — 15 минут</h3>
      </div>
    </div>
    <div class="actions">
      <button class="cta-primary">Начать сейчас →</button>
      <button class="cta-secondary">Через час</button>
    </div>
  </div>
</body>
</html>
