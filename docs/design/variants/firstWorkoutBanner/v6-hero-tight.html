<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>FirstWorkoutBanner — V6 Hero tight</title>
<style>
  :root {
    --bg: #0E0E0F;
    --surface: #17171A;
    --primary: #D4B07A;
    --primary-deep: #B08A4E;
    --text: #F4F1EA;
    --text-secondary: #C9C7C0;
    --text-tertiary: #8A8780;
    --text-inverse: #0A0A0A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
    padding: 40px; width: 375px;
  }
  .label { color: var(--text-tertiary); font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 12px; }

  /* V6 — V2 improved: removed huge body text, icon+title+CTA in one
     tighter row, gradient still present but subtler. Same premium
     feel as V2 but ~50% less vertical space. */
  .banner {
    position: relative;
    border-radius: 16px;
    padding: 16px 16px 14px;
    overflow: hidden;
    background:
      linear-gradient(135deg, rgba(212, 176, 122, 0.14) 0%, rgba(212, 176, 122, 0.02) 100%),
      var(--surface);
    border: 1px solid rgba(212, 176, 122, 0.3);
  }
  .banner::before {
    content: '';
    position: absolute;
    top: -30px; right: -30px;
    width: 110px; height: 110px;
    border-radius: 50%;
    background: radial-gradient(closest-side, rgba(212, 176, 122, 0.28) 0%, transparent 70%);
    pointer-events: none;
  }
  .close {
    position: absolute; top: 8px; right: 10px; padding: 4px;
    color: var(--text-secondary); background: transparent; border: none;
    cursor: pointer; font-size: 16px; line-height: 1;
    transform: rotate(45deg); z-index: 2;
  }
  .top {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 12px;
  }
  .icon-wrap {
    width: 38px; height: 38px;
    border-radius: 10px;
    background: var(--primary);
    color: var(--text-inverse);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    box-shadow: 0 3px 12px rgba(212, 176, 122, 0.32);
  }
  .titles { flex: 1; min-width: 0; }
  .label-tag {
    font-size: 9px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 1.4px; color: var(--primary); margin-bottom: 2px;
  }
  .title {
    font-size: 15px; font-weight: 700; color: var(--text);
    margin: 0; line-height: 20px;
  }
  .cta {
    width: 100%; padding: 11px 16px;
    border-radius: 10px;
    background: var(--primary); border: 1px solid var(--primary);
    color: var(--text-inverse); font-size: 13px; font-weight: 700;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
</style>
</head>
<body>
  <div class="label">V6 — Hero tight (improved V2: same impact, 50% less height)</div>
  <div class="banner">
    <button class="close">+</button>
    <div class="top">
      <div class="icon-wrap">🏋</div>
      <div class="titles">
        <div class="label-tag">ПЕРВЫЙ ШАГ</div>
        <h3 class="title">Открой профиль тренировкой</h3>
      </div>
    </div>
    <button class="cta">Начать — это 15 минут →</button>
  </div>
</body>
</html>
