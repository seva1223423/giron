<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>FirstWorkoutBanner — V2 Hero gradient</title>
<style>
  :root {
    --bg: #0E0E0F;
    --surface: #17171A;
    --primary: #D4B07A;
    --primary-deep: #B08A4E;
    --text: #F4F1EA;
    --text-secondary: #C9C7C0;
    --text-tertiary: #8A8780;
    --text-inverse: #0A0A0A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
    padding: 40px;
    width: 375px;
  }
  .label {
    color: var(--text-tertiary);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    margin-bottom: 12px;
  }

  /* V2 — full-width hero card, gradient fill */
  .banner {
    position: relative;
    border-radius: 20px;
    padding: 22px 20px 20px;
    overflow: hidden;
    background:
      linear-gradient(135deg, rgba(212, 176, 122, 0.18) 0%, rgba(212, 176, 122, 0.04) 100%),
      var(--surface);
    border: 1px solid rgba(212, 176, 122, 0.35);
  }
  .banner::before {
    /* Subtle gold orb behind icon */
    content: '';
    position: absolute;
    top: -40px;
    right: -40px;
    width: 140px;
    height: 140px;
    border-radius: 50%;
    background: radial-gradient(closest-side, rgba(212, 176, 122, 0.4) 0%, transparent 70%);
    pointer-events: none;
  }
  .close {
    position: absolute;
    top: 12px;
    right: 12px;
    padding: 4px;
    color: var(--text-secondary);
    background: transparent;
    border: none;
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    transform: rotate(45deg);
    z-index: 2;
  }
  .icon-wrap {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: var(--primary);
    color: var(--text-inverse);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    margin-bottom: 14px;
    box-shadow: 0 4px 16px rgba(212, 176, 122, 0.3);
  }
  .label-tag {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--primary);
    margin-bottom: 4px;
  }
  .title {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    margin: 0 0 6px 0;
    line-height: 24px;
  }
  .text {
    font-size: 13px;
    line-height: 19px;
    color: var(--text-secondary);
    margin: 0 0 16px 0;
  }
  .cta {
    width: 100%;
    padding: 12px 16px;
    border-radius: 12px;
    background: var(--primary);
    border: 1px solid var(--primary);
    color: var(--text-inverse);
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .arrow { font-size: 16px; transform: translateY(-1px); }
</style>
</head>
<body>
  <div class="label">V2 — Hero gradient (premium activation)</div>
  <div class="banner">
    <button class="close">+</button>
    <div class="icon-wrap">🏋</div>
    <div class="label-tag">ПЕРВЫЙ ШАГ</div>
    <h3 class="title">Открой профиль тренировкой</h3>
    <p class="text">Ты с нами больше суток. Короткая сессия 15 минут — и приложение начнёт работать на тебя: PRs, статистика, советы AI.</p>
    <button class="cta">Начать первую тренировку <span class="arrow">→</span></button>
  </div>
</body>
</html>
