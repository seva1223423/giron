<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>FirstWorkoutBanner — V4 Progress arc</title>
<style>
  :root {
    --bg: #0E0E0F;
    --surface: #17171A;
    --primary: #D4B07A;
    --primary-deep: #B08A4E;
    --text: #F4F1EA;
    --text-secondary: #C9C7C0;
    --text-tertiary: #8A8780;
    --text-inverse: #0A0A0A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
    padding: 40px;
    width: 375px;
  }
  .label {
    color: var(--text-tertiary);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    margin-bottom: 12px;
  }

  /* V4 — onboarding-style with progress arc showing journey */
  .banner {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px;
    border-radius: 16px;
    background: var(--surface);
    border: 1px solid rgba(212, 176, 122, 0.2);
    position: relative;
  }
  .ring {
    flex-shrink: 0;
    width: 56px;
    height: 56px;
    position: relative;
  }
  .ring svg {
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }
  .ring-track {
    fill: none;
    stroke: rgba(212, 176, 122, 0.15);
    stroke-width: 4;
  }
  .ring-progress {
    fill: none;
    stroke: var(--primary);
    stroke-width: 4;
    stroke-linecap: round;
    /* 1 of 4 onboarding steps complete: register, profile, first workout, first meal */
    stroke-dasharray: 157.08;
    stroke-dashoffset: 117.81;  /* 25% complete */
  }
  .ring-label {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 700;
    color: var(--primary);
  }
  .body {
    flex: 1;
    min-width: 0;
  }
  .step {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--text-tertiary);
    margin: 0 0 3px 0;
  }
  .title {
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    margin: 0 0 4px 0;
  }
  .text {
    font-size: 12px;
    line-height: 16px;
    color: var(--text-secondary);
    margin: 0;
  }
  .cta {
    flex-shrink: 0;
    padding: 9px 14px;
    border-radius: 8px;
    background: var(--primary);
    border: 1px solid var(--primary);
    color: var(--text-inverse);
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }
  .close {
    position: absolute;
    top: 8px;
    right: 10px;
    padding: 4px;
    color: var(--text-tertiary);
    background: transparent;
    border: none;
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
    transform: rotate(45deg);
  }
</style>
</head>
<body>
  <div class="label">V4 — Progress arc (onboarding journey)</div>
  <div class="banner">
    <button class="close">+</button>
    <div class="ring">
      <svg viewBox="0 0 56 56">
        <circle class="ring-track" cx="28" cy="28" r="25" />
        <circle class="ring-progress" cx="28" cy="28" r="25" />
      </svg>
      <div class="ring-label">1/4</div>
    </div>
    <div class="body">
      <div class="step">Старт</div>
      <h3 class="title">Сделай первую тренировку</h3>
      <p class="text">Один из 4 шагов настройки. 15 минут.</p>
    </div>
    <button class="cta">Начать</button>
  </div>
</body>
</html>
