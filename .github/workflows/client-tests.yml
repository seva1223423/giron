name: Client Tests

on:
  push:
    branches: [master, main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'babel.config.js'
      - 'jest.config.js'
      - '.github/workflows/client-tests.yml'
  pull_request:
    branches: [master, main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'babel.config.js'
      - 'jest.config.js'
      - '.github/workflows/client-tests.yml'

# If a newer push lands on the same branch, cancel the in-flight run. Without
# this, rapid back-to-back commits burn CI minutes on stale revisions and
# serialize unnecessarily on solo-founder velocity.
concurrency:
  group: client-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Jest (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Run client tests
        # 81+ suites (~2030 tests). All use mocked AsyncStorage + mocked services.
        # No device or Expo runtime needed — jest-expo preset handles RN mocking.
        run: npm test -- --no-coverage --forceExit
        env:
          NODE_ENV: test
