name: Server Tests

on:
  push:
    branches: [master, main]
    paths:
      - 'server/**'
      - '.github/workflows/server-tests.yml'
  pull_request:
    branches: [master, main]
    paths:
      - 'server/**'
      - '.github/workflows/server-tests.yml'

concurrency:
  group: server-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Jest + Prod Build (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          # Prisma generate only parses the schema — no real DB needed.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_dummy

      - name: TypeScript check
        run: npx tsc --noEmit
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_dummy

      - name: Run tests
        # All tests mock Prisma and set JWT secrets via src/__tests__/setup.ts.
        # No real database or external services needed.
        run: npm test -- --no-coverage --forceExit
        env:
          NODE_ENV: test

      - name: Production build
        # Catches prod-only issues that tsc --noEmit misses: missing output file
        # imports, circular deps that break at runtime, declaration merge edge
        # cases. Cheap (~30s) and saves the next Render deploy from a 500 loop.
        run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_dummy
