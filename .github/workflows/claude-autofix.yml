name: Claude Auto-Fix

# Triggered automatically when the Telegram bot creates an Issue with
# the `claude-fix` label. Claude reads the full error context (message,
# stack, route, user, app version) from the Issue body, investigates the
# repository, writes a test reproducing the bug, fixes the bug, and
# opens a PR linking back to the Issue.
#
# Trigger path:
#   1. Server / mobile error → Telegram bot ping
#   2. User taps "🔧 Fix it (Claude)" inline button in Telegram (from
#      anywhere — phone, laptop, friend's device, doesn't matter)
#   3. Bot creates GitHub Issue with `claude-fix` label
#   4. This workflow fires
#   5. PR appears within 2-5 min
#   6. User reviews + merges from GitHub mobile app
#   7. Render auto-deploys
#
# Cost: ~$0.10 - $1 per fix in Anthropic API tokens, depending on how
# much code Claude has to read. GitHub Actions minutes are also burned
# (~3-10 min per run). Free tier covers ~200-600 fixes/month.

on:
  issues:
    types: [labeled]

# Coarse permission grant — claude-code-action needs to clone, push,
# and open PRs. `issues: write` so it can comment on the originating
# issue (e.g., link the PR).
permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  autofix:
    # Only fire on the specific trigger label, not every label edit.
    if: github.event.label.name == 'claude-fix'
    runs-on: ubuntu-latest
    # Hard cap on runtime so a stuck Claude run can't burn the whole
    # GitHub Actions monthly quota.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so Claude can read prior commits / blame for
          # context. fetch-depth 0 is needed for branch operations.
          fetch-depth: 0

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are fixing a production bug reported via Telegram error
            logging. The full error context is in the Issue body below.

            Required workflow (per CLAUDE.md §4 in the repo):
              1. Read the error message + stack trace from the Issue body
              2. Locate the file/line referenced in the stack trace
              3. Reproduce the bug — either by reading the existing tests
                 and adding a new failing one, OR by examining the code
                 path leading to the error
              4. Write the fix. Follow the project conventions in
                 CLAUDE.md: surgical changes, no scope creep, match style
              5. Run `npm test` (client) and `cd server && npm test` to
                 verify nothing regressed
              6. Open a PR with:
                 - Title prefixed with `fix:`
                 - Body explaining the root cause + the fix
                 - "Closes #${{ github.event.issue.number }}" line so
                   merging the PR auto-closes the Issue

            DO NOT:
              - Touch unrelated files
              - Disable tests to make them pass
              - Hide errors with try/catch unless that's the actual fix
              - Bump version numbers or change app.json
              - Commit secrets, .env files, or any keystore

            Issue title: ${{ github.event.issue.title }}

            Issue body:
            ${{ github.event.issue.body }}
